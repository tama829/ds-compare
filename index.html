<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>料金比較ツール</title>

<!-- フォント -->
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: "Zen Maru Gothic", sans-serif;
  background: #fafafa;
  margin: 12px;
}

h1 {
  text-align: center;
  color: #c7000b;
  margin-bottom: 6px;
}

.note {
  text-align: center;
  font-size: 12px;
  color: #666;
  margin-bottom: 16px;
}

/* ===== 行レイアウト ===== */
.row {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1fr;
  gap: 10px;
  margin-bottom: 6px;
}

/* ===== セル ===== */
.cell {
  background: #ffffff;
  border: 1px solid #ddd;
  border-radius: 8px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  padding: 0 8px;
  font-size: 14px;
}

/* ===== 入力系（枠に完全フィット） ===== */
.cell input,
.cell select {
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 14px;
  font-family: "Inter", sans-serif;
}

/* 見出し */
.header {
  background: #fff0f0;
  font-weight: bold;
  color: #c7000b;
}

/* プラン名（左右共通） */
.plan-title {
  font-family: "Zen Maru Gothic", sans-serif;
  font-weight: normal;
  color: #c7000b;
  text-align: center;
}

/* inputの上書き（ここが重要） */
.cell input.plan-title {
  font-family: "Zen Maru Gothic", sans-serif;
  font-weight: normal;
}

/* 金額 */
.money {
  font-family: "Inter", sans-serif;
  font-weight: 600;
}

/* 実質料金 */
.final {
  background: #fff5f5;
  border: 2px solid #c7000b;
  color: #c7000b;
  font-weight: bold;
}

/* 差額 */
.diff {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  color: #c7000b;
  margin-top: 16px;
}

/*基本料金中央揃え*/
.number-input {
  text-align: center;
}

.price-cell {
  position: relative;
}

.price-cell input {
  padding-right: 24px;
}

.base-price {
  font-family: "Inter", sans-serif;
  font-size: 15px;
  text-align: center;
}

.base-price input {
  font-weight: 600; 
}

.yen {
  position: absolute;
  right: 13px;
  font-size: 15px;
  color: #666;
}

</style>
</head>

<body>

<h1>料金比較ツール</h1>
<div class="note">※お客様と一緒に条件を選択してください</div>

<!-- ===== ヘッダー ===== -->
<div class="row">
  <div class="cell header plan-title">ポイ活MAX</div>
  <div class="cell header">項目</div>
  <div class="cell header">
    <input type="text" class="plan-title" placeholder="プラン名">
  </div>
</div>

<!-- ===== 基本料金 ===== -->
<div class="row">
  <div class="cell money">11,748円</div>
  <div class="cell">基本料金</div>
<div class="cell price-cell base-price">
  <input type="number" id="r-base" class="number-input" placeholder="金額入力">
  <span class="yen">円</span>
</div>

</div>

<!-- ===== みんなドコモ割===== -->
<div class="row">
  <!-- 左 -->
  <div class="cell">
    <select id="l-d1" onchange="handleOther('l-d1','l-d1-o')">
      <option value="0">ー</option>
      <option value="550">550円</option>
      <option value=″1210″>1,210円</option>
      <option value="other">その他</option>
    </select>
     <input type="number" id="l-d1-o" placeholder="金額" style="display:none;">
  </div>

  <div class="cell">みんなドコモ割</div>

  <!-- 右 -->
  <div class="cell">
    <select id="r-d1" onchange="handleOther('r-d1','r-d1-o')">
      <option value="0">ー</option>
      <option value="550">550円</option>
      <option value=″1210″>1,210円</option>
      <option value="other">その他</option>
    </select>
     <input type="number" id="l-d1-o" placeholder="金額" style="display:none;">
  </div>
  
</div>

<!-- ===== 長期利用割===== -->
<div class="row">
  <!-- 左 -->
  <div class="cell">
    <select id="l-d1" onchange="handleOther('l-d1','l-d1-o')">
      <option value="0">ー</option>
      <option value="110">110円</option>
      <option value=″220″>220円</option>
      <option value="other">その他</option>
    </select>
     <input type="number" id="l-d1-o" placeholder="金額" style="display:none;">
  </div>

  <div class="cell">長期利用割</div>

  <!-- 右 -->
  <div class="cell">
    <select id="r-d1" onchange="handleOther('r-d1','r-d1-o')">
      <option value="0">ー</option>
      <option value="110">110円</option>
      <option value=″220″>220円</option>
      <option value="other">その他</option>
    </select>
     <input type="number" id="l-d1-o" placeholder="金額" style="display:none;">
  </div>
  
</div>

<!-- ===== dカードお支払い割===== -->
<div class="row">
  <!-- 左 -->
  <div class="cell">
    <select id="l-d1" onchange="handleOther('l-d1','l-d1-o')">
      <option value="0">ー</option>
      <option value="220">220円</option>
      <option value=″550″>550円</option>
      <option value="other">その他</option>
    </select>
     <input type="number" id="l-d1-o" placeholder="金額" style="display:none;">
  </div>

  <div class="cell">dカードお支払い割</div>

  <!-- 右 -->
  <div class="cell">
    <select id="r-d1" onchange="handleOther('r-d1','r-d1-o')">
      <option value="0">ー</option>
      <option value="220">220円</option>
      <option value=″550″>550円</option>
      <option value="other">その他</option>
    </select>
     <input type="number" id="l-d1-o" placeholder="金額" style="display:none;">
  </div>
  
</div>

<!-- ===== ドコモ光/home5Gセット割===== -->
<div class="row">
  <!-- 左 -->
  <div class="cell">
    <select id="l-d1" onchange="handleOther('l-d1','l-d1-o')">
      <option value="0">ー</option>
      <option value=″1210″>1,210円</option>
      <option value="other">その他</option>
    </select>
     <input type="number" id="l-d1-o" placeholder="金額" style="display:none;">
  </div>

  <div class="cell"> ドコモ光/home5Gセット割 </div>

  <!-- 右 -->
  <div class="cell">
    <select id="r-d1" onchange="handleOther('r-d1','r-d1-o')">
      <option value="0">ー</option>
      <option value=″1210″>1,210円</option>
      <option value="other">その他</option>
    </select>
     <input type="number" id="l-d1-o" placeholder="金額" style="display:none;">
  </div>
  
</div>

<!-- ===== でんきセット割===== -->
<div class="row">
  <!-- 左 -->
  <div class="cell">
    <select id="l-d1" onchange="handleOther('l-d1','l-d1-o')">
      <option value="0">ー</option>
      <option value="110">110円</option>
      <option value="other">その他</option>
    </select>
     <input type="number" id="l-d1-o" placeholder="金額" style="display:none;">
  </div>

  <div class="cell">でんきセット割</div>

  <!-- 右 -->
  <div class="cell">
    <select id="r-d1" onchange="handleOther('r-d1','r-d1-o')">
      <option value="0">ー</option>
      <option value="110">110円</option>
      <option value="other">その他</option>
    </select>
     <input type="number" id="l-d1-o" placeholder="金額" style="display:none;">
  </div>
  
</div>

<!-- その他入力欄 -->

<div class="row">
  <div class="cell price-cell">
    <input type="number" id="l-p1" placeholder="金額入力">
    <span class="yen">円</span>
  </div>
  <div class="cell">その他割引</div>
  <div class="cell price-cell">
    <input type="number" id="r-p1" placeholder="金額入力">
    <span class="yen">円</span>
  </div>
</div>

</div>

<!-- ===== 割引後 ===== -->
<div class="row">
  <div class="cell" id="l-after">—</div>
  <div class="cell">割引後料金</div>
  <div class="cell" id="r-after">—</div>
</div>

<!-- ===== ポイ活特典===== -->
<div class="row">
  <div class="cell price-cell">
    <input type="number" id="l-p1" placeholder="ポイント入力">
    <span class="yen">pt</span>
  </div>
  <div class="cell">ポイ活特典</div>
  <div class="cell">ー</div>
</div>

<!-- ===== 実質 ===== -->
<div class="row">
  <div class="cell final" id="l-final">—</div>
  <div class="cell">実質料金</div>
  <div class="cell final" id="r-final">—</div>
</div>

<div class="diff" id="diff">差額：—</div>

<script>
function n(id) {
  return Number(document.getElementById(id)?.value || 0);
}

function handleOther(selectId, otherId) {
  const select = document.getElementById(selectId);
  const wrap = document.getElementById(otherId + "-wrap");

  if (select.value === "other") {
    wrap.style.display = "flex";
  } else {
    wrap.style.display = "none";
    document.getElementById(otherId).value = "";
  }
  calc();
}

function getValue(selectId, otherId) {
  const select = document.getElementById(selectId);
  if (select.value === "other") {
    return n(otherId);
  }
  return Number(select.value || 0);
}

function calc() {
  const leftBase = 11748;

  const lDiscount = getValue("l-d1","l-d1-o");
  const lAfter = leftBase - lDiscount;
  document.getElementById("l-after").textContent = lAfter + "円";

  const lFinal = lAfter - n("l-p1");
  document.getElementById("l-final").textContent = lFinal + "円";

  const rAfter = n("r-base") - getValue("r-d1","r-d1-o");
  document.getElementById("r-after").textContent = rAfter + "円";

  const rFinal = rAfter - n("r-p1");
  document.getElementById("r-final").textContent = rFinal + "円";

  const diff = lFinal - rFinal;
  document.getElementById("diff").textContent =
    diff < 0 ? `ポイ活MAXのほうが実質 ${diff}円 お得🉐`

document.addEventListener("input", calc);
</script>

</body>
</html>
