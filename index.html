<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>料金比較ツール</title>

<!-- フォント -->
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: "Zen Maru Gothic", sans-serif;
  background: #fafafa;
  margin: 12px;
}

h1 {
  text-align: center;
  color: #c7000b;
  margin-bottom: 6px;
}

.note {
  text-align: center;
  font-size: 12px;
  color: #666;
  margin-bottom: 16px;
}

/* ===== 行レイアウト ===== */
.row {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1fr;
  gap: 10px;
  margin-bottom: 6px;
}

/* ===== セル ===== */
.cell {
  background: #ffffff;
  border: 1px solid #ddd;
  border-radius: 8px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  padding: 0 8px;
  font-size: 14px;
}

/* ===== 入力系（枠に完全フィット） ===== */
.cell input,
.cell select {
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 14px;
  font-family: "Inter", sans-serif;
}

/* 見出し */
.header {
  background: #fff0f0;
  font-weight: bold;
  color: #c7000b;
}

/* プラン名*/
.plan-title {
  font-family: "Zen Maru Gothic", sans-serif;
  font-weight: normal;
  color: #c7000b;
  text-align: center;
}

/* inputの上書き */
.cell input.plan-title {
  font-family: "Zen Maru Gothic", sans-serif;
  font-weight: normal;
}

/* 金額 */
.money {
  font-family: "Inter", sans-serif;
  font-weight: 600;
}

/* 割引後料金 */
.after {
  background: #fff5f5;
  border: 2px solid #c7000b;
  color: #c7000b;
  font-weight: bold;
}

/* 実質料金 */
.final {
  background: #fff5f5;
  border: 2px solid #c7000b;
  color: #c7000b;
  font-weight: bold;
}

/* 差額 */
.diff {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  color: #c7000b;
  margin-top: 16px;
}

/*基本料金中央揃え*/
.number-input {
  text-align: center;
}

.price-cell {
  position: relative;
}

.price-cell input {
  padding-right: 24px;
}

.base-price {
  font-family: "Inter", sans-serif;
  font-size: 15px;
  text-align: center;
}

.base-price input {
  font-weight: 600; 
}

.yen {
  position: absolute;
  right: 13px;
  font-size: 15px;
  color: #666;
}

</style>
</head>

<body>

<h1>料金比較ツール</h1>
<div class="note">※お客様と一緒に条件を選択してください</div>

<!-- ===== ヘッダー ===== -->
<div class="row">
  <div class="cell header plan-title">ポイ活MAX</div>
  <div class="cell header">項目</div>
  <div class="cell header">
    <input type="text" class="plan-title" placeholder="プラン名">
  </div>
</div>

<!-- ===== 基本料金 ===== -->
<div class="row">
  <div class="cell money">11,748円</div>
  <div class="cell">基本料金</div>
  <div class="cell price-cell base-price">
    <input type="number" id="r-base" class="number-input" placeholder="金額入力">
    <span class="yen">円</span>
  </div>
</div>

<!-- ===== 割引行一覧 ===== -->
<!-- みんなドコモ割 -->
<div class="row">
  <div class="cell">
    <select class="l-discount" data-other="l-d1-o-1" onchange="handleOther(this)">
      <option value="0">ー</option>
      <option value="550">550円</option>
      <option value="1210">1,210円</option>
      <option value="other">その他</option>
    </select>
    <div id="l-d1-o-1-wrap" style="display:none;">
      <input type="number" id="l-d1-o-1" class="l-discount-other number-input" placeholder="金額">
    </div>
  </div>
  <div class="cell">みんなドコモ割</div>
  <div class="cell">
    <select class="r-discount" data-other="r-d1-o-1" onchange="handleOther(this)">
      <option value="0">ー</option>
      <option value="550">550円</option>
      <option value="1210">1,210円</option>
      <option value="other">その他</option>
    </select>
    <div id="r-d1-o-1-wrap" style="display:none;">
      <input type="number" id="r-d1-o-1" class="r-discount-other number-input" placeholder="金額">
    </div>
  </div>
</div>

<!-- 長期利用割 -->
<div class="row">
  <div class="cell">
    <select class="l-discount" data-other="l-d1-o-2" onchange="handleOther(this)">
      <option value="0">ー</option>
      <option value="110">110円</option>
      <option value="220">220円</option>
      <option value="other">その他</option>
    </select>
    <div id="l-d1-o-2-wrap" style="display:none;">
      <input type="number" id="l-d1-o-2" class="l-discount-other number-input" placeholder="金額">
    </div>
  </div>
  <div class="cell">長期利用割</div>
  <div class="cell">
    <select class="r-discount" data-other="r-d1-o-2" onchange="handleOther(this)">
      <option value="0">ー</option>
      <option value="110">110円</option>
      <option value="220">220円</option>
      <option value="other">その他</option>
    </select>
    <div id="r-d1-o-2-wrap" style="display:none;">
      <input type="number" id="r-d1-o-2" class="r-discount-other number-input" placeholder="金額">
    </div>
  </div>
</div>

<!-- dカードお支払い割 -->
<div class="row">
  <div class="cell">
    <select class="l-discount" data-other="l-d1-o-3" onchange="handleOther(this)">
      <option value="0">ー</option>
      <option value="220">220円</option>
      <option value="550">550円</option>
      <option value="other">その他</option>
    </select>
    <div id="l-d1-o-3-wrap" style="display:none;">
      <input type="number" id="l-d1-o-3" class="l-discount-other number-input" placeholder="金額">
    </div>
  </div>
  <div class="cell">dカードお支払い割</div>
  <div class="cell">
    <select class="r-discount" data-other="r-d1-o-3" onchange="handleOther(this)">
      <option value="0">ー</option>
      <option value="220">220円</option>
      <option value="550">550円</option>
      <option value="other">その他</option>
    </select>
    <div id="r-d1-o-3-wrap" style="display:none;">
      <input type="number" id="r-d1-o-3" class="r-discount-other number-input" placeholder="金額">
    </div>
  </div>
</div>

<!-- ドコモ光/home5Gセット割 -->
<div class="row">
  <div class="cell">
    <select class="l-discount" data-other="l-d1-o-4" onchange="handleOther(this)">
      <option value="0">ー</option>
      <option value="1210">1,210円</option>
      <option value="other">その他</option>
    </select>
    <div id="l-d1-o-4-wrap" style="display:none;">
      <input type="number" id="l-d1-o-4" class="l-discount-other number-input" placeholder="金額">
    </div>
  </div>
  <div class="cell">ドコモ光/home5Gセット割</div>
  <div class="cell">
    <select class="r-discount" data-other="r-d1-o-4" onchange="handleOther(this)">
      <option value="0">ー</option>
      <option value="1210">1,210円</option>
      <option value="other">その他</option>
    </select>
    <div id="r-d1-o-4-wrap" style="display:none;">
      <input type="number" id="r-d1-o-4" class="r-discount-other number-input" placeholder="金額">
    </div>
  </div>
</div>

<!-- でんきセット割 -->
<div class="row">
  <div class="cell">
    <select class="l-discount" data-other="l-d1-o-5" onchange="handleOther(this)">
      <option value="0">ー</option>
      <option value="110">110円</option>
      <option value="other">その他</option>
    </select>
    <div id="l-d1-o-5-wrap" style="display:none;">
      <input type="number" id="l-d1-o-5" class="l-discount-other number-input" placeholder="金額">
    </div>
  </div>
  <div class="cell">でんきセット割</div>
  <div class="cell">
    <select class="r-discount" data-other="r-d1-o-5" onchange="handleOther(this)">
      <option value="0">ー</option>
      <option value="110">110円</option>
      <option value="other">その他</option>
    </select>
    <div id="r-d1-o-5-wrap" style="display:none;">
      <input type="number" id="r-d1-o-5" class="r-discount-other number-input" placeholder="金額">
    </div>
  </div>
</div>

<!-- その他割引 -->
<div class="row">
  <div class="cell price-cell">
    <input type="number" class="l-discount-other number-input" placeholder="金額入力">
    <span class="yen">円</span>
  </div>
  <div class="cell">その他割引</div>
  <div class="cell price-cell">
    <input type="number" class="r-discount-other number-input" placeholder="金額入力">
    <span class="yen">円</span>
  </div>
</div>

<!-- 割引後料金 -->
<div class="row">
  <div class="cell after" id="l-after">—</div>
  <div class="cell">割引後料金</div>
  <div class="cell after" id="r-after">—</div>
</div>

<!-- 通常還元-->
<div class="row">
  <div class="cell price-cell">
    <input type="number" class="l-point number-input" placeholder="ポイント入力">
    <span class="yen">pt</span>
  </div>
  <div class="cell">通常還元 1%還元</div>
  <div class="cell price-cell">
    <input type="number" class="r-point number-input" placeholder="ポイント入力">
    <span class="yen">pt</span>
  </div>
</div>

<!-- ポイ活特典 -->
<div class="row">
  <div class="cell price-cell">
    <input type="number" class="l-point number-input" placeholder="ポイント入力">
    <span class="yen">pt</span>
  </div>
  <div class="cell">ポイ活MAX 10%還元</div>
  <div class="cell">ー</div>
</div>

<!-- ドコモご利用料金-->
<div class="row">
  <div class="cell price-cell">
    <input type="number" class="l-point number-input" placeholder="ポイント入力">
    <span class="yen">pt</span>
  </div>

  <div class="cell" style="gap:4px;">
    <span>ドコモご利用料金</span>
    <input
      type="number"
      class="rate-input"
      placeholder="○○"
      style="
        width: 40px;
        border-bottom: 1px solid #ccc;
        text-align: center;
        font-family: Inter, sans-serif;
      "
    >
    <span>%還元</span>
  </div>

  <div class="cell price-cell">
    <input type="number" class="r-point number-input" placeholder="ポイント入力">
    <span class="yen">pt</span>
  </div>
</div>

<!-- ドコモでんき-->
<div class="row">
  <div class="cell price-cell">
    <input type="number" class="l-point number-input" placeholder="ポイント入力">
    <span class="yen">pt</span>
  </div>

  <div class="cell" style="gap:4px;">
    <span>ドコモでんき</span>
    <input
      type="number"
      class="rate-input"
      placeholder="○○"
      style="
        width: 40px;
        border-bottom: 1px solid #ccc;
        text-align: center;
        font-family: Inter, sans-serif;
      "
    >
    <span>%還元</span>
  </div>

  <div class="cell price-cell">
    <input type="number" class="r-point number-input" placeholder="ポイント入力">
    <span class="yen">pt</span>
  </div>
</div>

<!-- ファミリー特典-->
<div class="row">
  <div class="cell price-cell">
    <input type="number" class="l-point number-input" placeholder="ポイント入力">
    <span class="yen">pt</span>
  </div>
  <div class="cell">ファミリー特典</div>
  <div class="cell price-cell">
    <input type="number" class="r-point number-input" placeholder="ポイント入力">
    <span class="yen">pt</span>
  </div>
</div>

<!-- 実質料金 -->
<div class="row">
  <div class="cell final" id="l-final">—</div>
  <div class="cell">実質料金</div>
  <div class="cell final" id="r-final">—</div>
</div>

<div class="diff" id="diff">差額：—</div>

<script>
function n(value){return Number(value||0);}

// 「その他」入力の表示切替
function handleOther(select){
  const otherId = select.dataset.other;
  const wrap = document.getElementById(otherId+"-wrap");
  if(select.value==="other"){wrap.style.display="flex";}
  else{wrap.style.display="none";document.getElementById(otherId).value="";}
  calc();
}

// 割引合計
function sumDiscounts(prefix){
  let total=0;
  document.querySelectorAll(`.${prefix}-discount`).forEach(sel=>{
    if(sel.value==="other"){total+=n(document.getElementById(sel.dataset.other).value);}
    else{total+=n(sel.value);}
  });
  document.querySelectorAll(`.${prefix}-discount-other`).forEach(inp=>total+=n(inp.value));
  return total;
}

// ポイント合計
function sumPoints(prefix){
  let total=0;
  document.querySelectorAll(`.${prefix}-point`).forEach(p=>total+=n(p.value));
  return total;
}

function calc(){
  const leftBase=11748;
  const rightBase=n(document.getElementById("r-base").value);

  const lDiscount=sumDiscounts("l");
  const rDiscount=sumDiscounts("r");

  const lAfter=leftBase-lDiscount;
  const rAfter=rightBase-rDiscount;

  document.getElementById("l-after").textContent=lAfter+"円";
  document.getElementById("r-after").textContent=rAfter+"円";

  const lFinal=lAfter-sumPoints("l");
  const rFinal=rAfter-sumPoints("r");

  document.getElementById("l-final").textContent=lFinal+"円";
  document.getElementById("r-final").textContent=rFinal+"円";

  const diff=lFinal-rFinal;
  document.getElementById("diff").innerHTML=
    diff<0 ? `ポイ活の方が<br>実質 ${Math.abs(diff)}円 お得🉐` : `差額：${diff}円`;
}

document.addEventListener("input",calc);
</script>

</body>
</html>
