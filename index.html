<style>

body {
  font-family: "Noto Sans JP", "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #fafafa;
  margin: 12px;
}

/* ===== ロゴ ===== */
.logo-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 8px;
}

.logo-wrap img {
  max-width: 360px;
  width: 100%;
  height: auto;
}

h1 {
  text-align: center;
  color: #c7000b;
  margin-bottom: 6px;
}

.note {
  text-align: center;
  font-size: 12px;
  color: #666;
  margin-bottom: 16px;
}

/* ===== 行レイアウト ===== */
.row {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1fr;
  gap: 10px;
  margin-bottom: 6px;
}

/* ===== セル ===== */
.cell {
  background: #ffffff;
  border: 1px solid #ddd;
  border-radius: 2px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  padding: 0 8px;
  font-size: 14px;
}

/* ===== 入力系（枠に完全フィット） ===== */
.cell input,
.cell select {
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 14px;
  font-family: "Inter", sans-serif;
}

/* 見出し */
.header {
  background: #fff0f0;
  font-weight: bold;
  color: #c7000b;
}

/* ===== 特別ヘッダー ===== */

/* ポイ活MAX */
.head-poimax {
  border: 2px solid #c89932;
  color: #c89932;
  font-weight: 700;
  background: #fff1cf;
}

/* プラン名 */
.head-plan {
  border: 2px solid #333;
  background: #fff;
}

.head-plan select {
  color: #333;
  font-weight: 600;
}

/* 金額 */
.money {
  font-family: "Inter", sans-serif;
  font-weight: 600;
}

/* 割引後料金 */
.after {
  background: #fff5f5;
  border: 2px solid #c7000b;
  color: #c7000b;
  font-weight: bold;
}

/* 実質料金 */
.final {
  background: #fff5f5;
  border: 2px solid #c7000b;
  color: #c7000b;
  font-weight: bold;
}

/* 差額 */
.diff {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  color: #c7000b;
  margin-top: 16px;
}

/*基本料金中央揃え*/
.number-input {
  text-align: center;
}

.price-cell {
  position: relative;
}

.price-cell input {
  padding-right: 24px;
}

.base-price {
  font-family: "Inter", sans-serif;
  font-size: 15px;
  text-align: center;
}

.base-price input {
  font-weight: 600; 
}

.yen {
  position: absolute;
  right: 13px;
  font-size: 15px;
  color: #666;
}

/* ===== ポイ活吹き出し ===== */

.balloon {
  min-width: 60px;
  height: 30px;
  padding: 0 8px;  
  font-size: 14px;
  color: #fff;
  border-radius: 10px;
  background: #c7000b;
  position: absolute;
  top: -20px;
  z-index: 5;
  display: flex;
  justify-content: center;
  align-items: center;
}

.balloon::after {
  content: "";
  position: absolute;
  top: 100%;
  border: 5px solid transparent;
  border-top-color: #c7000b;
}

/* 左用 */
.balloon-left {
  left: -6px;
}
.balloon-left::after {
  left: 10px;
}

/* 右用 */
.balloon-right {
  right: -6px;
}
.balloon-right::after {
  right: 10px;
}
.balloon-right input {
  color: #fff;
}
.balloon-right input::placeholder {
  color: rgba(255,255,255,0.7);
}

.poi-row {
  margin-top: 20px;
}

/* ===== mini / irumo 用：逆三角形そのもの ===== */
.mini-triangle {
  position: absolute;
  top: 4px;
  left: 6px;

  width: 68px;
  height: 43px;
  background: #dff3ff;
  color: #000;

  display: none;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  gap: 2px;

  font-size: 13px;
  z-index: 10;

  /* ▼ 逆三角形 */
  clip-path: polygon(
    50% 43px,
    0% 0%,
    68px 0%
  );
}

/* 中の input */
.mini-triangle input {
  all: unset;
  width: 22px;
  text-align: right;
}


.price-cell {
  position: relative;
}

</style>
</head>

<script>
function n(value){return Number(value||0);}

function setPlanPrice(){
  const plan = document.getElementById("r-plan");
  const price = plan.value;
  document.getElementById("r-base").value = price || "";

  const text = plan.options[plan.selectedIndex].text;
  const isPoi = text.includes("ポイ活");

const isMiniIrumo =
  text.includes("mini") || text.includes("irumo");

  // =====mini irumo=====
document.getElementById("mini-rate-r").style.display =
  isMiniIrumo ? "flex" : "none";

  // ===== ポイ活特典 =====
  document.getElementById("poi-balloon-r").style.display = isPoi ? "block" : "none";
  document.getElementById("poi-input-r").style.display   = isPoi ? "block" : "none";
  document.getElementById("poi-yen-r").style.display     = isPoi ? "block" : "none";
  document.getElementById("poi-dash-r").style.display    = isPoi ? "none"  : "flex";

  // ===== ポイ活ファミリー特典 =====
  document.getElementById("family-input-r").style.display = isPoi ? "block" : "none";
  document.getElementById("family-yen-r").style.display   = isPoi ? "block" : "none";
  document.getElementById("family-dash-r").style.display  = isPoi ? "none"  : "flex";

  calc();
}

// 「その他」入力の表示切替
function handleOther(select){
  const otherId = select.dataset.other;
  const wrap = document.getElementById(otherId+"-wrap");
  if(select.value==="other"){wrap.style.display="flex";}
  else{wrap.style.display="none";document.getElementById(otherId).value="";}
  calc();
}

// 割引合計
function sumDiscounts(prefix){
  let total=0;
  document.querySelectorAll(`.${prefix}-discount`).forEach(sel=>{
    if(sel.value==="other"){total+=n(document.getElementById(sel.dataset.other).value);}
    else{total+=n(sel.value);}
  });
  document.querySelectorAll(`.${prefix}-discount-other`).forEach(inp=>total+=n(inp.value));
  return total;
}

// ポイント合計
function sumPoints(prefix){
  let total=0;
  document.querySelectorAll(`.${prefix}-point`).forEach(p=>total+=n(p.value));
  return total;
}

function calc(){
  const leftBase=11748;
  const rightBase=n(document.getElementById("r-base").value);

  const lDiscount=sumDiscounts("l");
  const rDiscount=sumDiscounts("r");

  const lAfter=leftBase-lDiscount;
  const rAfter=rightBase-rDiscount;

  document.getElementById("l-after").textContent=lAfter+"円";
  document.getElementById("r-after").textContent=rAfter+"円";

  const lFinal=lAfter-sumPoints("l");
  const rFinal=rAfter-sumPoints("r");

  document.getElementById("l-final").textContent=lFinal+"円";
  document.getElementById("r-final").textContent=rFinal+"円";

  const diff=lFinal-rFinal;
  document.getElementById("diff").innerHTML=
    diff<0 ? `ポイ活MAXの方が実質 ${Math.abs(diff)}円 お得🎊` : `差額：${diff}円`;
}

document.addEventListener("input",calc);
</script>
