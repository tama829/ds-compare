<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ポイ活MAX 料金比較</title>

<style>
  body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 12px;
  background: #fafafa;
}

h1 {
  text-align: center;
  color: #c7000b;
  margin-bottom: 4px;
}

.note {
  text-align: center;
  font-size: 12px;
  color: #666;
  margin-bottom: 16px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1fr;
  gap: 12px;
}

.col {
  background: #fff;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

.col h2 {
  text-align: center;
  color: #c7000b;
  margin-top: 0;
}

.center {
  text-align: center;
  font-weight: bold;
  border: none;
  background: none;
}

.price {
  font-size: 18px;
  text-align: center;
  margin-bottom: 10px;
}

.label {
  padding: 6px 0;
  font-size: 14px;
}

input {
  width: 100%;
  margin: 6px 0;
  padding: 6px;
  font-size: 14px;
}

.result {
  margin-top: 10px;
  font-weight: bold;
  text-align: center;
}

.strong {
  font-size: 20px;
  color: #c7000b;
  border: 2px solid #c7000b;
  padding: 8px;
  border-radius: 6px;
  background: #fff5f5;
}

.diff {
  text-align: center;
  margin: 20px 0;
  font-size: 22px;
  font-weight: bold;
  color: #c7000b;
}

@media (max-width: 700px) {
  .grid {
    grid-template-columns: 1fr;
  }
  .center {
    display: none;
  }
}
</style>
</head>

<body>

<h1>ポイ活MAX 料金比較ツール</h1>
<div class="note">※お客様と一緒に入力しながらご説明ください</div>

<div class="grid">

  <!-- 左：ポイ活MAX -->
  <div class="col">
    <h2>ポイ活MAX</h2>
    <div class="price">基本料金：11,748円</div>

    <input type="number" id="l-d1" placeholder="みんなドコモ割">
    <input type="number" id="l-d2" placeholder="長期利用割">
    <input type="number" id="l-d3" placeholder="dカードお支払い割">
    <input type="number" id="l-d4" placeholder="ドコモ光/home5G割">
    <input type="number" id="l-d5" placeholder="ドコモでんき割">

    <div class="result" id="l-after">割引後：0円</div>

    <hr>

    <input type="number" id="l-p1" placeholder="通常還元">
    <input type="number" id="l-p2" placeholder="ポイ活MAX 10%還元">
    <input type="number" id="l-p3" placeholder="利用料金還元">
    <input type="number" id="l-p4" placeholder="でんき還元">
    <input type="number" id="l-p5" placeholder="ファミリー特典">

    <div class="result strong" id="l-final">実質料金：0円</div>
  </div>

  <!-- 中央：項目名 -->
  <div class="center">
    <div class="price">&nbsp;</div>

    <div class="label">〜各種割引〜</div>
    <div class="label">みんなドコモ割</div>
    <div class="label">長期利用割</div>
    <div class="label">dカードお支払い割</div>
    <div class="label">ドコモ光/home5G</div>
    <div class="label">ドコモでんき</div>
    <div class="label">割引適用後</div>

    <div class="label">〜ポイント還元〜</div>
    <div class="label">通常還元</div>
    <div class="label">10%還元</div>
    <div class="label">利用料金</div>
    <div class="label">でんき</div>
    <div class="label">ファミリー</div>
    <div class="label">実質料金</div>
  </div>

  <!-- 右：比較プラン -->
  <div class="col">
    <input type="text" placeholder="プラン名">
    <input type="number" id="r-base" placeholder="基本料金">

    <input type="number" id="r-d1" placeholder="割引①">
    <input type="number" id="r-d2" placeholder="割引②">
    <input type="number" id="r-d3" placeholder="割引③">
    <input type="number" id="r-d4" placeholder="割引④">
    <input type="number" id="r-d5" placeholder="割引⑤">

    <div class="result" id="r-after">割引後：0円</div>

    <hr>

    <input type="number" id="r-p1" placeholder="通常還元">
    <input type="number" id="r-p2" placeholder="利用料金還元">
    <input type="number" id="r-p3" placeholder="でんき還元">
    <input type="number" id="r-p4" placeholder="ファミリー特典">

    <div class="result strong" id="r-final">実質料金：0円</div>
  </div>

</div>

<div class="diff" id="diff">差額：0円</div>

<script>
function n(id) {
  return Number(document.getElementById(id)?.value || 0);
}

function calc() {
  const leftBase = 11748;

  const lDiscount = n("l-d1")+n("l-d2")+n("l-d3")+n("l-d4")+n("l-d5");
  const lAfter = leftBase - lDiscount;
  document.getElementById("l-after").textContent =
    `割引後：${lAfter.toLocaleString()}円`;

  const lPoint = n("l-p1")+n("l-p2")+n("l-p3")+n("l-p4")+n("l-p5");
  const lFinal = lAfter - lPoint;
  document.getElementById("l-final").textContent =
    `実質料金：${lFinal.toLocaleString()}円`;

  const rBase = n("r-base");
  const rDiscount = n("r-d1")+n("r-d2")+n("r-d3")+n("r-d4")+n("r-d5");
  const rAfter = rBase - rDiscount;
  document.getElementById("r-after").textContent =
    `割引後：${rAfter.toLocaleString()}円`;

  const rPoint = n("r-p1")+n("r-p2")+n("r-p3")+n("r-p4");
  const rFinal = rAfter - rPoint;
  document.getElementById("r-final").textContent =
    `実質料金：${rFinal.toLocaleString()}円`;

  const diff = lFinal - rFinal;
  document.getElementById("diff").textContent =
    diff > 0 ? `ポイ活MAXが ${diff.toLocaleString()}円 高い`
             : diff < 0 ? `ポイ活MAXが ${Math.abs(diff).toLocaleString()}円 安い`
             : "同額";
}

document.addEventListener("input", calc);
</script>

</body>
</html>
