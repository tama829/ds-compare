<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>料金比較ツール</title>

<!-- フォント -->
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: "Zen Maru Gothic", sans-serif;
  background: #fafafa;
  margin: 12px;
}

h1 {
  text-align: center;
  color: #c7000b;
  margin-bottom: 6px;
}

.note {
  text-align: center;
  font-size: 12px;
  color: #666;
  margin-bottom: 16px;
}

/* 行グリッド */
.row {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1fr;
  gap: 10px;
  margin-bottom: 6px;
}

/* セル */
.cell {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  font-size: 14px;
  padding: 0 6px;
}

/* 入力 */
.cell input,
.cell select {
  width: 100%;
  height: 100%;
  border: none;
  font-size: 14px;
  font-family: "Inter", sans-serif;
}

/* 見出し */
.header {
  background: #fff0f0;
  font-weight: bold;
  color: #c7000b;
}

/* 金額表示 */
.money {
  font-family: "Inter", sans-serif;
  font-weight: 600;
}

/* 実質料金 */
.final {
  background: #fff5f5;
  border: 2px solid #c7000b;
  color: #c7000b;
  font-weight: bold;
}

/* 差額 */
.diff {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  color: #c7000b;
  margin-top: 16px;
}

/* スマホ */
@media (max-width: 700px) {
  .row {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<h1>料金比較ツール</h1>
<div class="note">※お客様と一緒に条件を選択してくださいか</div>

<!-- ヘッダー -->
<div class="row">
  <div class="cell header">ポイ活MAX</div>
  <div class="cell header">項目</div>
  <div class="cell header">
    <input type="text" placeholder="比較プラン名">
  </div>
</div>

<!-- 基本料金 -->
<div class="row">
  <div class="cell money">11,748円</div>
  <div class="cell">基本料金</div>
  <div class="cell">
    <input type="number" id="r-base" placeholder="金額入力">
  </div>
</div>

<!-- みんなドコモ割 -->
<div class="row">
  <div class="cell">
    <select id="l-d1" onchange="handleOther('l-d1','l-d1-o')">
      <option value="0">ー</option>
      <option value="1100">1,100円</option>
      <option value="2200">2,200円</option>
      <option value="other">その他</option>
    </select>
    <input type="number" id="l-d1-o" placeholder="金額" style="display:none;">
  </div>

  <div class="cell">みんなドコモ割</div>

  <div class="cell">
    <select id="r-d1" onchange="handleOther('r-d1','r-d1-o')">
      <option value="0">ー</option>
      <option value="1100">1,100円</option>
      <option value="2200">2,200円</option>
      <option value="other">その他</option>
    </select>
    <input type="number" id="r-d1-o" placeholder="金額" style="display:none;">
  </div>
</div>

<!-- 割引後 -->
<div class="row">
  <div class="cell money" id="l-after">—</div>
  <div class="cell">割引後料金</div>
  <div class="cell money" id="r-after">—</div>
</div>

<!-- ポイント -->
<div class="row">
  <div class="cell">
    <input type="number" id="l-p1" placeholder="ポイント還元">
  </div>
  <div class="cell">ポイント還元</div>
  <div class="cell">
    <input type="number" id="r-p1" placeholder="ポイント還元">
  </div>
</div>

<!-- 実質 -->
<div class="row">
  <div class="cell final money" id="l-final">—</div>
  <div class="cell">実質料金</div>
  <div class="cell final money" id="r-final">—</div>
</div>

<div class="diff" id="diff">差額：—</div>

<script>
function n(id) {
  return Number(document.getElementById(id)?.value || 0);
}

function handleOther(selectId, otherId) {
  const select = document.getElementById(selectId);
  const other = document.getElementById(otherId);

  if (select.value === "other") {
    other.style.display = "block";
  } else {
    other.style.display = "none";
    other.value = "";
  }
  calc();
}

function getValue(selectId, otherId) {
  const select = document.getElementById(selectId);
  if (select.value === "other") {
    return n(otherId);
  }
  return Number(select.value || 0);
}

function calc() {
  const leftBase = 11748;

  const lDiscount = getValue("l-d1","l-d1-o");
  const lAfter = leftBase - lDiscount;
  document.getElementById("l-after").textContent = lAfter + "円";

  const lFinal = lAfter - n("l-p1");
  document.getElementById("l-final").textContent = lFinal + "円";

  const rAfter = n("r-base") - getValue("r-d1","r-d1-o");
  document.getElementById("r-after").textContent = rAfter + "円";

  const rFinal = rAfter - n("r-p1");
  document.getElementById("r-final").textContent = rFinal + "円";

  const diff = lFinal - rFinal;
  document.getElementById("diff").textContent =
    diff > 0 ? `ポイ活MAXのほうが ${diff}円 高い`
             : diff < 0 ? `ポイ活MAXのほうが ${Math.abs(diff)}円 安い`
             : "同額";
}

document.addEventListener("input", calc);
</script>

</body>
</html>
